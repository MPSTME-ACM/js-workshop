<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dice Roller & Password Generator</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 40px auto; max-width: 600px; }
        button { padding: 8px 16px; margin: 5px; font-size: 14px; cursor: pointer; }
        .section { margin-bottom: 40px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- PART 3: Dice Roller -->
    <div class="section">
        <h2>Dice Roller</h2>
        <label># of Dice: </label>
        <input type="number" id="numOfDice" value="1" min="1" max="10">
        <button id="rollBtn">Roll Dice</button>
        <div id="diceResult" style="margin-top: 10px; font-weight: bold;"></div>
        <div id="diceImages" style="margin-top: 10px;"></div>
    </div>

    <!-- PART 4: Random Password Generator -->
    <div class="section">
        <h2>Random Password Generator</h2>
        <label>Length: </label>
        <input type="number" id="passLength" value="12" min="1"><br><br>
        
        <input type="checkbox" id="incLower" checked>
        <label for="incLower">Include Lowercase</label><br>
        
        <input type="checkbox" id="incUpper" checked>
        <label for="incUpper">Include Uppercase</label><br>
        
        <input type="checkbox" id="incNumbers" checked>
        <label for="incNumbers">Include Numbers</label><br>
        
        <input type="checkbox" id="incSymbols" checked>
        <label for="incSymbols">Include Symbols</label><br><br>
        
        <button id="genPassBtn">Generate Password</button>
        <p id="passResult" style="font-weight: bold; font-family: monospace; font-size: 18px;"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
